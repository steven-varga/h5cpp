name: Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  HDF5_SERIES: "1.12"
  HDF5_VERSION: 1.12.3
  HDF5_CACHE_VERSION: v5

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux (DEB + RPM) ────────────────────────────────────────────────────────
  package-linux:
    name: ${{ matrix.arch }} / DEB + RPM
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            deb_arch: amd64
            rpm_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            deb_arch: arm64
            rpm_arch: aarch64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build wget rpm

      - name: Install HDF5 ${{ env.HDF5_VERSION }} from source
        uses: ./.github/actions/install-hdf5
        with:
          cache-key-suffix: -pkg-${{ matrix.arch }}

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_PACKAGING_INSTALL_PREFIX=/usr \
            -DHDF5_ROOT="$HDF5_ROOT" \
            -DH5CPP_BUILD_EXAMPLES=OFF \
            -DH5CPP_BUILD_TESTS=OFF \
            -DH5CPP_BUILD_BENCH=OFF \
            -DH5CPP_USE_LIBDEFLATE=OFF \
            -DH5CPP_USE_ZSTD=OFF

      - name: Build (amalgamation only)
        run: cmake --build build --target h5cpp-amalgamate

      - name: Package DEB
        run: cd build && cpack -G DEB
        env:
          CPACK_DEBIAN_PACKAGE_ARCHITECTURE: ${{ matrix.deb_arch }}

      - name: Package RPM
        run: cd build && cpack -G RPM
        env:
          CPACK_RPM_PACKAGE_ARCHITECTURE: ${{ matrix.rpm_arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux-${{ matrix.arch }}
          path: |
            build/*.deb
            build/*.rpm
          if-no-files-found: error

  # ── macOS (.pkg via productbuild) ────────────────────────────────────────────
  package-macos:
    name: macos-15 / arm64 / pkg
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install hdf5

      - name: Configure
        run: |
          # The .pkg payload is the amalgamated header. The optional filter
          # libs (libdeflate / zstd / lz4 / szip) compile to static archives
          # whose targets we never `cmake --build`, so their install rules
          # would reference non-existent .a files and CPack would fail with
          # "file INSTALL cannot find liblibh5cpp-libdeflate-static.a".
          # Disabling the H5CPP_USE_* options prunes both the build and the
          # install rules. Mirror what package-linux already does.
          HDF5_PREFIX="$(brew --prefix hdf5)"
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DHDF5_ROOT="$HDF5_PREFIX" \
            -DCMAKE_PREFIX_PATH="$HDF5_PREFIX" \
            -DH5CPP_BUILD_EXAMPLES=OFF \
            -DH5CPP_BUILD_TESTS=OFF \
            -DH5CPP_BUILD_BENCH=OFF \
            -DH5CPP_USE_LIBDEFLATE=OFF \
            -DH5CPP_USE_ZSTD=OFF \
            -DH5CPP_USE_LZ4=OFF \
            -DH5CPP_USE_SZIP=OFF

      - name: Build (amalgamation only)
        run: cmake --build build --target h5cpp-amalgamate

      - name: Package
        run: cd build && cpack -G productbuild

      - uses: actions/upload-artifact@v4
        with:
          name: packages-macos-arm64
          path: build/*.pkg
          if-no-files-found: error

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  # No Chocolatey 'hdf5' package exists; mirror the build-from-source approach
  # from ci.yml.  zlib is built fresh each run (~30s); HDF5 install prefix is
  # cached between runs.
  package-windows:
    name: windows / x64 / NSIS
    runs-on: windows-2025-vs2026

    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: powershell
        run: |
          # NSIS is not on windows-latest by default; CPack -G NSIS needs
          # `makensis` on PATH and the NSIS registry key to initialise the
          # generator. The chocolatey package installs both.
          choco install nsis -y --no-progress
          # Add NSIS dir to GITHUB_PATH explicitly — refreshenv only updates
          # the current shell, not subsequent step shells.
          $nsisDir = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            $nsisDir = "C:\Program Files\NSIS"
          }
          if (-not (Test-Path "$nsisDir\makensis.exe")) {
            throw "makensis.exe not found after NSIS install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisDir
          & "$nsisDir\makensis.exe" /VERSION

      - name: Build zlib from source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $zlib_version = "1.3.1"
          $zlib_archive = "$env:RUNNER_TEMP\zlib-$zlib_version.tar.gz"
          $zlib_source  = "$env:RUNNER_TEMP\zlib-$zlib_version"
          $zlib_build   = "$env:RUNNER_TEMP\zlib-build"
          $zlib_prefix  = "$env:RUNNER_TEMP\zlib-install"

          Invoke-WebRequest `
            -Uri "https://github.com/madler/zlib/archive/refs/tags/v$zlib_version.tar.gz" `
            -OutFile $zlib_archive
          tar -xzf $zlib_archive -C $env:RUNNER_TEMP

          cmake -S $zlib_source -B $zlib_build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$zlib_prefix"
          cmake --build $zlib_build --parallel --config Release
          cmake --install $zlib_build --config Release

      - name: Restore HDF5 cache
        id: cache-hdf5
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}\hdf5-${{ env.HDF5_VERSION }}-install
          key: hdf5-${{ runner.os }}-pkg-${{ env.HDF5_VERSION }}-${{ env.HDF5_CACHE_VERSION }}

      - name: Build HDF5 from source
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $hdf5_version = "${{ env.HDF5_VERSION }}"
          $hdf5_archive = "$env:RUNNER_TEMP\hdf5-$hdf5_version.tar.gz"
          $hdf5_source  = "$env:RUNNER_TEMP\hdf5-$hdf5_version"
          $hdf5_build   = "$env:RUNNER_TEMP\hdf5-$hdf5_version-build"
          $hdf5_prefix  = "$env:RUNNER_TEMP\hdf5-$hdf5_version-install"

          Invoke-WebRequest `
            -Uri "https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.12/hdf5-$hdf5_version/src/hdf5-$hdf5_version.tar.gz" `
            -OutFile $hdf5_archive
          tar -xzf $hdf5_archive -C $env:RUNNER_TEMP

          cmake -S $hdf5_source -B $hdf5_build `
            -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_INSTALL_PREFIX="$hdf5_prefix" `
            -DHDF_CFG_NAME=Release `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=OFF `
            -DHDF5_BUILD_TOOLS=OFF `
            -DHDF5_BUILD_UTILS=OFF `
            -DHDF5_BUILD_EXAMPLES=OFF `
            -DHDF5_BUILD_CPP_LIB=OFF `
            -DHDF5_BUILD_HL_LIB=OFF `
            -DHDF5_BUILD_FORTRAN=OFF `
            -DHDF5_ENABLE_Z_LIB_SUPPORT=ON `
            -DHDF5_ENABLE_SZIP_SUPPORT=OFF `
            -DZLIB_USE_EXTERNAL=OFF `
            -DZLIB_INCLUDE_DIR="$env:RUNNER_TEMP/zlib-install/include" `
            -DZLIB_LIBRARY="$env:RUNNER_TEMP/zlib-install/lib/zlib.lib"

          cmake --build $hdf5_build --parallel --config Release
          cmake --install $hdf5_build --config Release

      - name: Save HDF5 cache
        if: steps.cache-hdf5.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}\hdf5-${{ env.HDF5_VERSION }}-install
          key: ${{ steps.cache-hdf5.outputs.cache-primary-key }}

      - name: Configure
        shell: pwsh
        run: |
          # Mirror Linux/macOS: prune the H5CPP_USE_* filter libs we never
          # actually build (the only target we run is h5cpp-amalgamate),
          # so their install rules don't reference non-existent .lib files.
          $hdf5_prefix = "$env:RUNNER_TEMP/hdf5-${{ env.HDF5_VERSION }}-install"
          $zlib_prefix = "$env:RUNNER_TEMP/zlib-install"
          cmake -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DHDF5_ROOT="$hdf5_prefix" `
            -DCMAKE_PREFIX_PATH="$hdf5_prefix;$zlib_prefix" `
            -DH5CPP_BUILD_EXAMPLES=OFF `
            -DH5CPP_BUILD_TESTS=OFF `
            -DH5CPP_BUILD_BENCH=OFF `
            -DH5CPP_USE_LIBDEFLATE=OFF `
            -DH5CPP_USE_ZSTD=OFF `
            -DH5CPP_USE_LZ4=OFF `
            -DH5CPP_USE_SZIP=OFF

      - name: Build (amalgamation only)
        run: cmake --build build --target h5cpp-amalgamate --config Release

      - name: Package
        run: cd build && cpack -G NSIS

      - name: Upload NSIS output log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nsis-output-log
          path: build/_CPack_Packages/win64/NSIS/NSISOutput.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows-x64
          path: build/*.exe
          if-no-files-found: error

  # ── AppImage (TODO) ───────────────────────────────────────────────────────────
  # h5cpp is header-only; AppImage wraps executables, not headers.
  # AppImage packaging of the h5cpp-compiler binary belongs in the
  # h5cpp-compiler repo. Add it here when that binary is vendored.

  # ── Publish release ──────────────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [package-linux, package-macos, package-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist/

      - name: List artifacts
        run: ls -lh dist/

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          tag="${{ github.ref_name }}"
          repo="${{ github.repository }}"
          # First-time publish: create the release with auto-generated notes.
          # Re-run: the release already exists (possibly with hand-edited body
          # and notes), so just upload/replace assets via --clobber.
          if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber --repo "$repo"
          else
            gh release create "$tag" dist/* \
              --title "h5cpp $tag" \
              --generate-notes \
              --repo "$repo"
          fi
